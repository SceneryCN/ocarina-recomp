name: Windows x64 setup

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-x64-setup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build Windows x64 installer
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python x64
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
          cache-dependency-path: tools/requirements-build.txt

      - name: Check source and package version
        id: package
        run: |
          python tools/check_content.py
          if ($LASTEXITCODE -ne 0) { throw 'Source content check failed' }
          python tests/check_content_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Content guard tests failed' }
          python tests/check_setup_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Package validator tests failed' }
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Invalid VERSION: $version"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag must match VERSION: expected v$version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "archive=build/setup/Ocarina-Setup-$version-windows-x64.zip" >> $env:GITHUB_OUTPUT
          "folder=build/setup/Ocarina-Setup-$version" >> $env:GITHUB_OUTPUT

      - name: Set up .NET 10 x64
        id: dotnet
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
          architecture: x64

      - name: Select the installed .NET 10 SDK
        env:
          SDK_VERSION: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          if ($env:SDK_VERSION -notmatch '^10\.0\.\d+$') { throw 'Expected a stable .NET 10 SDK' }
          @{ sdk = @{ version = $env:SDK_VERSION; rollForward = 'disable' } } |
            ConvertTo-Json | Set-Content global.json -Encoding utf8
          dotnet --version
          if ($LASTEXITCODE -ne 0) { throw '.NET SDK selection failed' }

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          release: false
          update: true
          install: mingw-w64-ucrt-x86_64-clang

      - name: Install build dependencies
        run: |
          python -m pip install -r tools/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed' }

      - name: Build the Windows x64 shader translator
        run: |
          python tools/build_xlate.py
          if ($LASTEXITCODE -ne 0) { throw 'Shader translator build failed' }

      - name: Build the installer ZIP
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          PACKAGE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;C:\msys64\usr\bin;$env:PATH"
          python tools/oot/make_setup.py --out build/setup
          if ($LASTEXITCODE -ne 0) { throw 'Installer packaging failed' }
          Move-Item -LiteralPath "build/setup/Ocarina-Setup-$env:PACKAGE_VERSION-windows.zip" -Destination $env:PACKAGE_ARCHIVE

      - name: Verify package content and x64 binaries
        env:
          PACKAGE_FOLDER: ${{ steps.package.outputs.folder }}
          PACKAGE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          python tools/oot/check_setup.py --folder $env:PACKAGE_FOLDER --archive $env:PACKAGE_ARCHIVE
          if ($LASTEXITCODE -ne 0) { throw 'Installer validation failed' }
          $hash = (Get-FileHash -LiteralPath $env:PACKAGE_ARCHIVE -Algorithm SHA256).Hash.ToLowerInvariant()
          "### Windows x64 installer" >> $env:GITHUB_STEP_SUMMARY
          "File: $([IO.Path]::GetFileName($env:PACKAGE_ARCHIVE))" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          'Contains the installer and build tools; the player supplies their own game locally.' >> $env:GITHUB_STEP_SUMMARY

      - name: Upload installer ZIP directly
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Add download link
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: '"[Download Windows x64 installer]($env:ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY'
